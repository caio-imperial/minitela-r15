[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minitela-r15"
version = "0.1.0"
description = "Ferramentas para a tela secundária GC9002 do Positivo Vision R15M no Linux"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Caio Imperial" }]
keywords = ["minitela", "gc9002", "positivo", "vision", "r15m", "acf", "ahmi"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = []

[project.urls]
Homepage = "https://caio-imperial.github.io/minitela-r15/"
Source = "https://github.com/caio-imperial/minitela-r15"

[project.scripts]
minitela = "minitela_cli:main"

[tool.setuptools]
py-modules = [
  "minitela_cli",
  "minitela_ctl",
  "minitela_tags",
  "minitela_patch",
  "minitela_build",
  "minitela_gui",
  "minitela_recover",
  "acf_codec",
  "acf_inspect",
  "acf_anim",
]

name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar MkDocs Material
        run: pip install mkdocs-material==9.*

      - name: Build estrito (falha em link quebrado)
        run: mkdocs build --strict

      - name: Publicar em gh-pages
        run: mkdocs gh-deploy --force
